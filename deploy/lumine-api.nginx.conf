# nginx reverse proxy for the Lumine API (alternative to Caddyfile).
# Replace api.example.com with the domain whose DNS A record points at this server.
# Run certbot afterwards to add HTTPS automatically.
# Install:
#   cp lumine-api.nginx.conf /etc/nginx/sites-available/lumine-api
#   ln -s /etc/nginx/sites-available/lumine-api /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.example.com

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location / {
        proxy_pass http://127.0.0.1:5111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
